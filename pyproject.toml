[project]
name = "pixelpipe-api"
version = "0.1.0"
description = "PixelPipe Image Processing API for Cloudflare Workers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
