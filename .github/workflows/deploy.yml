name: Deploy PixelPipe API

on:
  # Manual trigger with environment and branch selection
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy"
        required: true
        type: choice
        default: "dev"
        options:
          - "dev"
          - "production"

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run Pytest suite
        run: uv run pytest

  deploy:
    name: Deploy to Cloudflare (${{ inputs.environment }})
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          uv sync
          uv run pywrangler sync

      - name: Apply D1 Database Migrations (${{ inputs.environment }})
        run: |
          if [ "${{ inputs.environment }}" = "dev" ]; then
            npx wrangler d1 migrations apply DB --remote --env dev
          else
            npx wrangler d1 migrations apply DB --remote
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker (${{ inputs.environment }})
        run: |
          if [ "${{ inputs.environment }}" = "dev" ]; then
            npx wrangler deploy --env dev
          else
            npx wrangler deploy --env=""
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
